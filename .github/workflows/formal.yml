name: Formal Model

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  stable-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install . pytest build
      - name: Prove formal exporters are absent from stable artifacts
        run: python -m pytest tests/artifact/test_artifact_contract.py
