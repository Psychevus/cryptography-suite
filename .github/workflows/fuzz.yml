name: Stable Negative Boundary

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  stable-negative-boundary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify fail-closed and import boundaries
        run: python -m pytest tests/negative tests/contract/test_import_boundaries.py
