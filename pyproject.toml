# Packaging configuration for cryptography-suite
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptography-suite"
dynamic = ["version"]
description = "An educational and research-focused cryptography toolkit under active hardening."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mojtaba Zaferanloo", email = "psychevus@gmail.com"}
]
keywords = [
    "cryptography",
    "encryption",
    "security",
    "AES",
    "RSA",
    "ChaCha20",
    "Ed25519",
    "ECDSA",
    "hashing",
    "PAKE",
    "OTP",
    "secret sharing",
    "education",
    "research"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research"
]

dependencies = [
    "cryptography>=46.0.5",
]

[project.optional-dependencies]
cli = ["PyYAML", "rich"]
hashing-extra = ["blake3"]
bls = ["py_ecc"]
pake = ["spake2"]
pqc = ["pqcrypto"]
fhe = ["Pyfhel"]
zk = ["pybulletproofs", "PySNARK"]
codegen = ["Jinja2", "PyYAML"]
network = ["requests"]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "mypy",
    "types-PyYAML",
    "hypothesis",
    "pytest-console-scripts",
    "freezegun",
]
async = ["aiofiles"]
docs = ["sphinx", "furo", "myst-parser", "sphinxcontrib-mermaid"]
viz = ["ipywidgets", "networkx"]
kms = ["boto3"]
aws = ["boto3"]
hsm = ["python-pkcs11>=0.8.1"]
legacy = ["salsa20>=0.9", "ascon>=1.2"]

[project.urls]
Homepage = "https://github.com/Psychevus/cryptography-suite"
Documentation = "https://psychevus.github.io/cryptography-suite"
Source = "https://github.com/Psychevus/cryptography-suite"
Tracker = "https://github.com/Psychevus/cryptography-suite/issues"

[tool.setuptools.dynamic]
version = {attr = "cryptography_suite.__version__"}

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cryptography_suite*"]
namespaces = false

[tool.setuptools.package-data]
"cryptography_suite" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
exclude = ["^tests/"]


[tool.pytest.ini_options]
markers = [
    "unit: fast deterministic unit tests",
    "integration: cross-module integration tests",
    "contract: external boundary contract tests",
    "negative: invalid input and failure-path tests",
]
